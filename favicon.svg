<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#7DF9FF"/>
      <stop offset="55%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#003D4D"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- bezel -->
  <circle cx="32" cy="32" r="31" fill="#000000"/>

  <!-- outer cyan ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#glow)"/>

  <!-- inner ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.85"/>

  <!-- core disc -->
  <circle cx="32" cy="32" r="9" fill="url(#g)" filter="url(#glow)"/>

  <!-- hot center -->
  <circle cx="32" cy="32" r="3" fill="#FFFFFF"/>

  <!-- Clu orange notch (top) -->
  <path d="M 28 4.2 A 28 28 0 0 1 36 4.2" stroke="#FF6B00" stroke-width="2.4" fill="none" stroke-linecap="round" filter="url(#glow)"/>
</svg>
